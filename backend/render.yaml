services:
  - type: web
    name: seo-auditor-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: RENDER_JS
        value: "0"
      # Set these in the Render dashboard (Environment tab) — secrets, not synced.
      # Email goes over the Gmail API (HTTPS) — Render free tier blocks SMTP ports.
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FEEDBACK_TO
        sync: false
      - key: APP_URL
        sync: false
      # Secret that unlocks the /api/stats owner dashboard.
      - key: ADMIN_TOKEN
        sync: false
