services:
  - type: web
    name: seo-auditor-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: RENDER_JS
        value: "0"
      # Set these in the Render dashboard (Environment tab) — secrets, not synced.
      - key: DATABASE_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FEEDBACK_TO
        sync: false
      - key: APP_URL
        sync: false
